<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2455">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>บันทึกงานท่าเรือ พระนั่งเกล้า</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
</head><body>
<div id="app">
 <section id="login"><div class="stage">
  <label class="fld" id="e1"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input id="em" type="text" placeholder="ชื่อผู้ใช้หรืออีเมล" autocomplete="username" autocapitalize="none" aria-label="ชื่อผู้ใช้หรืออีเมล"></label>
  <label class="fld" id="e2"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" aria-label="รหัสผ่าน"></label>
  <button id="forgot" aria-label="ลืมรหัสผ่าน">ลืมรหัสผ่าน?</button>
  <button id="go" aria-label="เข้าสู่ระบบ">เข้าสู่ระบบ</button>
  <div id="lerr" role="alert"></div>
 </div></section>
 <section id="shell">
  <header class="top"><small id="stn"></small><h1 id="ttl"></h1><span class="pill" id="who"></span></header>
  <main id="main"></main>
  <nav id="nav"></nav>
 </section>
 <div class="toast" id="toast" role="status"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="app.js"></script><script src="pdf.js"></script><script src="menus.js"></script>
</body></html>
